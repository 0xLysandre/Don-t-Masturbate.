<!doctype html>
<html lang="en">
  <head>

    <title>Blocked</title>
    <link rel="stylesheet" href="ui.css" />

  <body class="centered">
    <main class="card">
      <p class="eyebrow">Accountability Blocker</p>
      <h1 id="headline">Blocked</h1>
      <p id="detail" class="lead"></p>
      <p class="muted" id="context"></p>
      <div class="row">
        <button class="primary" id="back">Go back</button>
